import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application' apply false
    id 'com.google.gms.google-services' version '4.5.0' apply false
    id 'com.google.firebase.crashlytics' version '3.0.8' apply false
}

subprojects {
    // ------------------------------------------------------------------
    // media3 (Nagram 12.10.2+): the submodule at TMessagesProj_Modules/media
    // brings ~39 library projects of its own, each configured by its own
    // common_library_config.gradle / constants.gradle (compileSdk 35, Java 8,
    // per-module namespace). MeeroX's global android{} below would override
    // that (compileSdk 37 / Java 21 / core-library desugaring without a
    // desugaring dependency), so media3 modules are excluded from it and only
    // get Nagram's namespace fallback.
    // ------------------------------------------------------------------
    if (project.projectDir.absolutePath.contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        // Groovy 4 (Gradle 9) no longer auto-imports XmlSlurper.
                        def manifest = new groovy.xml.XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
        return
    }

    afterEvaluate {
        if (plugins.hasPlugin("com.android.library") || plugins.hasPlugin("com.android.application")) {
            android {
                compileSdk = 37
                buildToolsVersion = "36.0.0"
                ndkVersion = "27.2.12479018"

                lint {
                    checkReleaseBuilds = false
                    disable 'MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi'
                }

                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_21
                    targetCompatibility = JavaVersion.VERSION_21

                    coreLibraryDesugaringEnabled = true
                }

                kotlin {
                    compilerOptions {
                        jvmTarget = JvmTarget.JVM_21
                    }
                }

                defaultConfig {
                    minSdk = 27
                    targetSdk = 36
                }

                buildFeatures.buildConfig = true
            }
        }
    }
}
